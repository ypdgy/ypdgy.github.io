<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>题库浏览</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#fff; --line:#e3e8ef; --text:#1f2937; --muted:#6b7280;
    --green:#0f9d58; --green-bg:#e9f7ef; --blue:#2563eb;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text); line-height:1.7;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",
                "Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  .wrap{max-width:960px; margin:0 auto; padding:0 16px 80px;}

  .toolbar{
    position:sticky; top:0; z-index:10;
    background:rgba(245,247,250,.96);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    padding:16px 0 12px; border-bottom:1px solid var(--line); margin-bottom:18px;
  }
  .toolbar h1{font-size:18px; margin:0 0 10px;}
  .toolbar h1 small{font-size:12px; font-weight:400; color:var(--muted); margin-left:8px;}
  .controls{display:flex; gap:10px;}
  #search{
    flex:1; min-width:0; padding:10px 14px; font-size:15px; color:var(--text);
    border:1px solid var(--line); border-radius:10px; background:#fff; outline:none;
  }
  #search:focus{border-color:var(--blue); box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  #toggleAnswer{
    flex:none; padding:10px 16px; font-size:14px; cursor:pointer;
    color:#fff; background:var(--blue); border:none; border-radius:10px;
  }
  #toggleAnswer:hover{filter:brightness(1.08);}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:16px 18px; margin-bottom:14px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .card.hidden{display:none;}

  .card-head{
    display:flex; flex-wrap:wrap; align-items:center; gap:8px;
    font-size:13px; color:var(--muted);
  }
  .idx{font-weight:700; color:var(--blue);}
  .qid{
    font-family:ui-monospace,Consolas,Menlo,monospace; font-size:12px;
    background:#f1f5f9; padding:1px 7px; border-radius:6px;
  }
  .chip{background:#eef2ff; color:#4338ca; padding:1px 8px; border-radius:999px; font-size:12px;}
  .answer{margin-left:auto; color:var(--green); font-weight:700;}

  .title{font-size:17px; font-weight:600; margin:10px 0 12px;}

  .options{list-style:none; margin:0; padding:0;}
  .opt{
    display:flex; gap:10px; align-items:flex-start;
    padding:8px 12px; border-radius:8px; border:1px solid transparent;
  }
  .opt + .opt{margin-top:6px;}
  .opt .key{
    flex:0 0 22px; height:22px; line-height:22px; margin-top:2px;
    text-align:center; border-radius:50%; font-size:12px; font-weight:700;
    background:#eef2f7; color:#475569;
  }
  .opt .text{flex:1; word-break:break-word;}
  .opt.correct{background:var(--green-bg); border-color:#bfe3cd;}
  .opt.correct .key{background:var(--green); color:#fff;}
  .tag{
    flex:none; align-self:center; font-size:12px; color:#fff;
    background:var(--green); padding:1px 8px; border-radius:999px; white-space:nowrap;
  }

  /* 隐藏答案模式 */
  body.hide-answer .opt.correct{background:transparent; border-color:transparent;}
  body.hide-answer .opt.correct .key{background:#eef2f7; color:#475569;}
  body.hide-answer .opt.correct .tag{display:none;}
  body.hide-answer .answer{visibility:hidden;}

  .empty{text-align:center; color:var(--muted); padding:60px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <h1>题库浏览<small id="stat"></small></h1>
    <div class="controls">
      <input id="search" type="search" autocomplete="off"
             placeholder="搜索题号 / 题干 / 选项内容（清空后可用 Ctrl+F 查找全部题目）">
      <button id="toggleAnswer" type="button">隐藏答案</button>
    </div>
  </div>

  <main id="list"></main>
  <p class="empty" id="empty" hidden>没有匹配的题目</p>
</div>

<script>
(function () {
  'use strict';

  var bank      = window.__BANK__ || [];
  var listEl    = document.getElementById('list');
  var statEl    = document.getElementById('stat');
  var searchEl  = document.getElementById('search');
  var toggleEl  = document.getElementById('toggleAnswer');
  var emptyEl   = document.getElementById('empty');
  var cards     = [];

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }

  function buildCard(q, index) {
    var card = el('article', 'card');
    card.id = 'q-' + q.id;
    card.dataset.search = q.search_text || '';

    var head = el('div', 'card-head');
    head.appendChild(el('span', 'idx', '#' + index));
    head.appendChild(el('span', 'qid', 'ID ' + q.id));
    if (q.type_name) head.appendChild(el('span', 'chip', q.type_name));
    if (q.score)     head.appendChild(el('span', 'chip', q.score + ' 分'));
    head.appendChild(el('span', 'answer',
      '答案：' + (q.correct_answer && q.correct_answer.length
                  ? q.correct_answer.join('、') : '—')));
    card.appendChild(head);

    card.appendChild(el('h2', 'title', q.title));

    var ul = el('ul', 'options');
    (q.options || []).forEach(function (opt) {
      var li = el('li', 'opt' + (opt.is_correct ? ' correct' : ''));
      li.appendChild(el('span', 'key', opt.key));
      li.appendChild(el('span', 'text', opt.text));
      if (opt.is_correct) li.appendChild(el('span', 'tag', '✓ 正确答案'));
      ul.appendChild(li);
    });
    card.appendChild(ul);

    return card;
  }

  // 一次性渲染
  var frag = document.createDocumentFragment();
  bank.forEach(function (q, i) {
    var c = buildCard(q, i + 1);
    cards.push(c);
    frag.appendChild(c);
  });
  listEl.appendChild(frag);

  // 搜索过滤
  function update() {
    var kw = searchEl.value.trim().toLowerCase();
    var visible = 0;
    cards.forEach(function (card) {
      var hit = !kw || (card.dataset.search || '').indexOf(kw) !== -1;
      card.classList.toggle('hidden', !hit);
      if (hit) visible++;
    });
    statEl.textContent = kw
      ? ('匹配 ' + visible + ' / 共 ' + bank.length + ' 题')
      : ('共 ' + bank.length + ' 题');
    emptyEl.hidden = visible !== 0;
  }

  searchEl.addEventListener('input', update);
  searchEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { searchEl.value = ''; update(); }
  });

  // 显示 / 隐藏答案
  var showAnswer = true;
  toggleEl.addEventListener('click', function () {
    showAnswer = !showAnswer;
    document.body.classList.toggle('hide-answer', !showAnswer);
    toggleEl.textContent = showAnswer ? '隐藏答案' : '显示答案';
  });

  update();
})();
</script>
